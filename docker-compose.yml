name: echorouk_editorial_os

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_DOCLING: ${INSTALL_DOCLING:-false}
    container_name: ech-backend
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      APP_ENV: production
      APP_DEBUG: "false"
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      freshrss:
        condition: service_healthy
      rssbridge:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ech-network

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_DOCLING: ${INSTALL_DOCLING:-false}
    container_name: ech-worker
    command: >
      celery -A app.queue.celery_app:celery_app worker
      --loglevel=INFO
      --queues=ai_router,ai_scribe,ai_quality,ai_simulator,ai_msi,ai_links,ai_trends,ai_scripts
      --concurrency=${CELERY_WORKER_CONCURRENCY:-4}
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      APP_ENV: production
      APP_DEBUG: "false"
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ech-network

  flower:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_DOCLING: ${INSTALL_DOCLING:-false}
    container_name: ech-flower
    command: celery -A app.queue.celery_app:celery_app flower --port=5555 --basic-auth=${FLOWER_BASIC_AUTH_USER?FLOWER_BASIC_AUTH_USER is required}:${FLOWER_BASIC_AUTH_PASSWORD?FLOWER_BASIC_AUTH_PASSWORD is required}
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      APP_ENV: production
      APP_DEBUG: "false"
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:5555:5555"
    restart: unless-stopped
    networks:
      - ech-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NEXT_PUBLIC_FLOWER_URL: ${NEXT_PUBLIC_FLOWER_URL:-http://127.0.0.1:5555}
        NEXT_PUBLIC_BREAKING_TTL_MINUTES: ${NEXT_PUBLIC_BREAKING_TTL_MINUTES:-60}
    container_name: ech-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
      NEXT_PUBLIC_FLOWER_URL: ${NEXT_PUBLIC_FLOWER_URL:-http://127.0.0.1:5555}
      NEXT_PUBLIC_BREAKING_TTL_MINUTES: ${NEXT_PUBLIC_BREAKING_TTL_MINUTES:-60}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ech-network

  postgres:
    image: pgvector/pgvector:pg16
    container_name: ech-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-echorouk_db}
      POSTGRES_USER: ${POSTGRES_USER:-echorouk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./scripts/seed_sources.sql:/docker-entrypoint-initdb.d/02-seed-sources.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-echorouk}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ech-network

  redis:
    image: redis:7-alpine
    container_name: ech-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD?REDIS_PASSWORD is required}
    command: sh -c 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ech-network

  minio:
    image: minio/minio:latest
    container_name: ech-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ech-network

  freshrss-db:
    image: mariadb:11
    container_name: ech-freshrss-db
    environment:
      MYSQL_ROOT_PASSWORD: ${FRESHRSS_DB_ROOT_PASSWORD?FRESHRSS_DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${FRESHRSS_DB_NAME:-freshrss}
      MYSQL_USER: ${FRESHRSS_DB_USER:-freshrss}
      MYSQL_PASSWORD: ${FRESHRSS_DB_PASSWORD?FRESHRSS_DB_PASSWORD is required}
    volumes:
      - freshrss_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - ech-network

  freshrss:
    image: freshrss/freshrss:latest
    container_name: ech-freshrss
    depends_on:
      freshrss-db:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Africa/Algiers}
      CRON_MIN: '*/20'
      FRESHRSS_INSTALL: |-
        --api-enabled
        --base-url ${FRESHRSS_BASE_URL:-https://echswarm.agentdz.com/freshrss}
        --db-base ${FRESHRSS_DB_NAME:-freshrss}
        --db-host freshrss-db
        --db-password ${FRESHRSS_DB_PASSWORD?FRESHRSS_DB_PASSWORD is required}
        --db-type mysql
        --db-user ${FRESHRSS_DB_USER:-freshrss}
        --default-user ${FRESHRSS_ADMIN_USER:-admin}
        --language ar
        --auth-type form
      FRESHRSS_USER: |-
        --api-password=${FRESHRSS_API_PASSWORD?FRESHRSS_API_PASSWORD is required}
        --email=${FRESHRSS_ADMIN_EMAIL:-admin@localhost}
        --language=ar
        --password=${FRESHRSS_ADMIN_PASSWORD?FRESHRSS_ADMIN_PASSWORD is required}
        --user=${FRESHRSS_ADMIN_USER:-admin}
    ports:
      - "8082:80"
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@file_get_contents('http://127.0.0.1/i/')===false?1:0);\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - freshrss_data:/var/www/FreshRSS/data
      - freshrss_extensions:/var/www/FreshRSS/extensions
    restart: unless-stopped
    networks:
      - ech-network

  rssbridge:
    image: rssbridge/rss-bridge:latest
    container_name: ech-rssbridge
    ports:
      - "8083:80"
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@file_get_contents('http://127.0.0.1/')===false?1:0);\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - ./docs/rssbridge/whitelist.txt:/app/whitelist.txt:ro
    restart: unless-stopped
    networks:
      - ech-network

volumes:
  pgdata:
  redis_data:
  minio_data:
  freshrss_db_data:
  freshrss_data:
  freshrss_extensions:

networks:
  ech-network:
    driver: bridge
